[project]
name = "whales"
version = "0.1.0"
description = "Explore cetacean audio datasets, annotations, and sound-to-form experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "huggingface-hub>=1.31,<2",
    "polars>=1.44.2",
    "typer>=0.27.2",
]

# `uv run start` / `uv run stop`: set up and serve the orchestra (orchestra.py)
[project.scripts]
start = "orchestra:start_main"
stop = "orchestra:stop_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# uv installs the checkout in editable mode, which puts the repository root on sys.path
[tool.hatch.build.targets.wheel]
packages = ["experiments"]
only-include = ["experiments", "main.py", "orchestra.py", "dclde.py", "dclde_opportunities.py", "dclde_visuals.py", "dataset_world_map.py"]

[dependency-groups]
# Recording analysis, guides and deterministic composition; ACE-Step has its own environment.
audio = [
    "matplotlib>=3.10",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]
art = [
    "accelerate>=1.15.0",
    "diffusers>=0.40.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.7",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]
mesh = [
    "embreex>=4.4.0",
    "fast-simplification>=0.2.0",
    "trimesh>=5.1.1",
]
midi = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]
viz = ["matplotlib>=3.10"]
