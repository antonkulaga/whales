[project]
name = "whales"
version = "0.1.0"
description = "Explore cetacean audio datasets, annotations, and sound-to-form experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "huggingface-hub>=1.31,<2",
    "polars>=1.44.2",
    "typer>=0.27.2",
]

[dependency-groups]
art = [
    "accelerate>=1.15.0",
    "diffusers>=0.40.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]
viz = ["matplotlib>=3.10"]
